# 影片 → 上市公司映射表（只收录 A 股上市公司 + 港股通标的港股）
#
# 匹配优先级：ids（猫眼 movieId）> names 精确匹配
# role: producer（默认，含联合出品）| distributor（仅重要发行，须写 note）
# core: true 标记对该公司业绩弹性大的片子
#
# ids/names 对照自 2026-10-07 快照；归属依据见各条目 note（媒体报道/公司互动回应）

companies:
